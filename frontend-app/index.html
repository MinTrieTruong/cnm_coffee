<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f0e6" />
    <script>
      // Chế độ sáng/tối khách đã chọn — đặt trước khi vẽ trang để không chớp màu (xem lib/siteTheme.ts)
      try { var m = localStorage.getItem("c-mode") || localStorage.getItem("c-mode-site"); if (m === "dark" || m === "light") document.documentElement.dataset.cMode = m; } catch (e) {}
    </script>
    <meta name="color-scheme" content="light" />
    <title>TD Coffee — Đặt món & mang về</title>
    <link rel="icon" type="image/png" href="/logo-td-coffee.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-td-coffee.svg" />
    <link rel="apple-touch-icon" href="/logo-td-coffee.png" />
    <!-- /staff.webmanifest (cài app nhân sự) được chèn khi vào khu nhân sự — src/lib/push.ts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
